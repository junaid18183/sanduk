version: 2

project_name: sanduk

# No `go mod tidy` hook: a release must build exactly the committed go.mod and
# go.sum (CI checks they are tidy), never ones rewritten at release time.

builds:
  # macOS needs cgo: 99designs/keyring's Keychain backend and sanduk's
  # keychain-biometric backend are both compiled only under `darwin && cgo`.
  # Building macOS with CGO_ENABLED=0 yields a binary with no OS keystore.
  - id: sanduk-darwin
    main: .
    binary: sanduk
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/junaid18183/sanduk/cli.version={{ .Version }}

  - id: sanduk-others
    main: .
    binary: sanduk
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/junaid18183/sanduk/cli.version={{ .Version }}

archives:
  - id: sanduk
    ids:
      - sanduk-darwin
      - sanduk-others
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# Keyless signing of the checksum file. Verify a download with:
#   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/junaid18183/sanduk/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   sha256sum --ignore-missing -c checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

# A software bill of materials per archive, generated by syft.
sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# Homebrew tap publishing is opt-in: it needs a token that can push to
# github.com/junaid18183/homebrew-tap, which the default GITHUB_TOKEN cannot.
# To enable it:
#   1. create a `homebrew-tap` repository under junaid18183
#   2. create a PAT with `repo` scope and add it as the repository secret
#      HOMEBREW_TAP_GITHUB_TOKEN
#   3. pass that secret to the GoReleaser step in
#      .github/workflows/release.yml as HOMEBREW_TAP_GITHUB_TOKEN
#   4. uncomment the block below
#
# brews:
#   - name: sanduk
#     repository:
#       owner: junaid18183
#       name: homebrew-tap
#       token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
#     directory: Formula
#     homepage: https://github.com/junaid18183/sanduk
#     description: Store API keys in your OS keychain and inject them on demand
#     license: MIT
#     install: |
#       bin.install "sanduk"
