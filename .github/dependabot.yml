version: 2
updates:
  # Keeps the SHA-pinned actions current. The cooldown waits two weeks after a
  # release before proposing it, so a compromised or broken release has time to
  # be caught and yanked first.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go:
        patterns: ["*"]
